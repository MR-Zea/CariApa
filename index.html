<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CariApa — Minimalist Search</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #f3f3f3;
            --muted-color: #888888;
            --card-bg: #181818;
            --border-color: #333333;
            --input-bg: #1a1a1a;
            --hover-bg: #262626;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f4;
            --text-color: #111111;
            --muted-color: #666666;
            --card-bg: #ffffff;
            --border-color: #dddddd;
            --input-bg: #ffffff;
            --hover-bg: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        /* Top Header / Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .brand-core {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--muted-color);
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        /* Tombol Icon (Theme Toggle) */
        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 20;
            outline: none;
        }

        .icon-btn:hover {
            background-color: var(--hover-bg);
        }

        /* Main Content Container */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
        }

        /* Bahagian Tempat Logo (Logo Container) */
        .logo-container {
            width: 72px;
            height: 72px;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            background-color: var(--card-bg);
            color: var(--muted-color);
            font-size: 11px;
            text-align: center;
            padding: 4px;
        }
        
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .logo-area h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            display: inline-flex;
            align-items: center;
        }

        .logo-area h1 span {
            color: var(--muted-color);
        }

        /* Subtitle */
        .subtitle {
            font-size: 0.95rem;
            color: var(--muted-color);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 36px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            pointer-events: none;
        }

        /* Search Box Wrapper */
        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 8px 8px 20px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 20;
        }

        .search-box:focus-within {
            border-color: var(--text-color);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--muted-color);
        }

        /* Tombol Cari (Tab yang sama) */
        .search-btn {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 25;
            white-space: nowrap;
            outline: none;
        }

        .search-btn:hover {
            opacity: 0.85;
        }

        /* Shortcut Links */
        .shortcuts {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 20;
        }

        .shortcut-chip {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .shortcut-chip:hover {
            background-color: var(--hover-bg);
        }

        /* Footer Status */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            font-size: 0.85rem;
            color: var(--muted-color);
            position: relative;
            z-index: 10;
        }

        .status-online {
            color: #4ade80;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand-core">CariApa // Core</div>
        <div class="controls">
            <button class="icon-btn" id="themeToggle" title="Ganti Tema">☀️</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Tempat Logo (Gantikan elemen di dalam div ini dengan tag <img> jika sudah ada logo) -->
        <div class="logo-container" id="logoContainer" title="CariApa">
            <img src="logo.png">
        </div>

        <div class="logo-area">
            <h1>CariApa<span>.</span></h1>
        </div>
        <div class="subtitle">Zero Distraction • Monochrome Gateway</div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Ketik apa saja untuk menelusuri..." autofocus>
            <button class="search-btn" id="searchBtn">Cari</button>
        </div>

        <div class="shortcuts">
            <a href="https://github.com" target="_blank" class="shortcut-chip">GitHub</a>
            <a href="https://chatgpt.com" target="_blank" class="shortcut-chip">ChatGPT</a>
            <a href="https://youtube.com" target="_blank" class="shortcut-chip">YouTube</a>
            <a href="https://www.detik.com/" target="_blank" class="shortcut-chip">Berita</a>
        </div>
    </div>

    <!-- Footer Bar -->
    <div class="footer-bar">
        <div>Status: <span class="status-online">● Online</span> &nbsp;&nbsp;|&nbsp;&nbsp; Latensi: 12ms</div>
        <div>CariApa Search Gateway</div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        // Toggle Light/Dark Mode
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '☀️️';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙';
            }
        });

        // Fungsi Carian (Tab yang sama)
        function performSearch() {
            const query = searchInput.value.trim();
            if (query) {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        searchBtn.addEventListener('click', performSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
